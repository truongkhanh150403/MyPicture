server:
  port: 8080

spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate #Hibernate đọc 5 entity, so sánh với bảng thật trên TiDB, Không sửa DB, chỉ kiểm tra.
                # Hoặc none đã tạo sẵn database và table nên không cần tạo lại
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  access-expiration: 15m
  refresh-expiration: 7d